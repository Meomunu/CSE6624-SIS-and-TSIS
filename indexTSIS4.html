
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>education</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background: #f5f8f1;
            color: #252525;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: black;
        }

        section {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .page-box {
            width: 320px;
            min-height: 320px;
            background: #646881;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 35px;
            color: white;
        }

        input, button {
            padding: 10px;
            margin: 8px;
            font-family: 'Nunito', sans-serif;
        }

        button {
            background: #646881;
            color: white;
            border: none;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 30px 15px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .nav-links {
                flex-direction: column;
                gap: 10px;
            }

            .page-box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </div>
        </nav>
    </header>

    <main>

        <section id="home">
            <div class="page-box">
                <h1>Education.</h1>
                <p>Learn new things, share ideas, and achieve your goals.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>CSE6624 Meiirzhan Seitkhan 081011552746 niche-13</p>
    </footer>

</body>
</html>
