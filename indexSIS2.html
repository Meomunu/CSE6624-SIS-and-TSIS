<!DOCTYPE html>
<html>
<head>
    <title>Pizza Art - Meirzhan Seitkhan</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .pizza {
            width: 200px;
            height: 200px;
            background: hsl(92, 65%, 40%);
            border: 10px solid hsl(151, 70%, 45%);
            border-radius: 50%;
            margin: 30px auto;
            position: relative;
        }

        .cheese {
            background: hsl(92, 65%, 60%);
            position: absolute;
            top: 15px;
            left: 15px;
            width: 170px;
            height: 170px;
            border-radius: 50%;
        }

        .olive {
            background: hsl(151, 70%, 45%);
            width: 25px;
            height: 25px;
            border-radius: 50%;
            position: absolute;
        }

        .one {
            top: 35px;
            left: 40px;
        }

        .two {
            top: 90px;
            left: 110px;
        }

        .three {
            top: 125px;
            left: 45px;
        }
    </style>
</head>
<body>
    <h1>My CSS Pizza</h1>

    <div class="pizza">
        <div class="cheese"></div>
        <div class="olive one"></div>
        <div class="olive two"></div>
        <div class="olive three"></div>
    </div>

    <p>My pizza made with CSS shapes.</p>

    <footer>
        CSE6624 | Meirzhan Seitkhan | 081011552746 | niche-4
    </footer>
</body>
</html>
