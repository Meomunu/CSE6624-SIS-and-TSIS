
<!DOCTYPE html>
<html>
<head>
    <title>Education Quiz</title>
    <style>
        body {
            background: #f5f8f1;
            font-family: Arial;
            text-align: center;
        }

        .box {
            background: #646881;
            color: white;
            width: 300px;
            margin: 80px auto;
            padding: 25px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Education Quiz</h1>
    <p id="progress"></p>
    <h3 id="question"></h3>
    <div id="answers"></div>
    <p id="feedback"></p>
    <p id="score">Score: 0</p>
    <button id="next" onclick="nextQuestion()" hidden>Next</button>
</div>

<script>
const questions = [
    ["Why is education important?", ["Learn new things", "Waste time", "Sleep"], 0],
    ["Which skill solves problems?", ["Guessing", "Critical thinking", "Ignoring"], 1],
    ["Best way to learn?", ["Give up", "Practice", "Never try"], 1],
    ["What does teamwork improve?", ["Isolation", "Laziness", "Communication"], 2],
    ["Why keep learning?", ["Stop growing", "Develop ourselves", "Avoid knowledge"], 1]
];

let current = 0;
let points = 0;

function showQuestion() {
    progress.textContent = "Question " + (current + 1) + "/5";
    question.textContent = questions[current][0];
    answers.innerHTML = "";
    feedback.textContent = "";
    score.textContent = "Score: " + points;

    questions[current][1].forEach((answer, i) => {
        let btn = document.createElement("button");
        btn.textContent = answer;

        btn.onclick = function() {
            if (i == questions[current][2]) {
                points++;
                feedback.textContent = "Correct!";
            } else {
                feedback.textContent = "Incorrect!";
            }

            score.textContent = "Score: " + points;
            answers.innerHTML = "";
            next.hidden = false;
        };

        answers.appendChild(btn);
    });
}

function nextQuestion() {
    current++;

    if (current < 5) {
        next.hidden = true;
        showQuestion();
    } else {
        question.textContent = "Quiz finished!";
        progress.textContent = "Completed";
        feedback.textContent = "Your result: " + points + "/5";
        next.hidden = true;
    }
}

showQuestion();
</script>

</body>
</html>
